<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sauna — Login</title>
  <style>
    :root {
      --bg:                 #1a1a2e;
      --bg-elev:            #16213e;
      --bg-input:           #0f3460;
      --text:               #eee;
      --text-muted:         #a0aec0;
      --accent:             #e94560;
      --err:                #fc8181;
      --border:             #2d3748;
      --radius-sm:          6px;
      --radius:             8px;
      --radius-lg:          12px;
      --font-stack:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-stack);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .box {
      background: var(--bg-elev);
      border-radius: var(--radius-lg);
      padding: 36px 40px;
      width: 100%;
      max-width: 340px;
    }
    h1 { color: var(--accent); margin: 0 0 24px; font-size: 1.4em; text-align: center; }
    label { display: block; margin-bottom: 6px; font-size: 0.85em; color: var(--text-muted); }
    input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font: 1em var(--font-stack);
      margin-bottom: 16px;
    }
    input:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font: 1em var(--font-stack);
      cursor: pointer;
      transition: filter 0.1s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { opacity: 0.8; }
    button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    #err {
      margin-top: 14px;
      font-size: 0.85em;
      color: var(--err);
      text-align: center;
      min-height: 1.2em;
    }
    /* L5 — hide the form while we check for an existing session, to avoid
       briefly flashing the login UI before redirecting an already-authed user. */
    body.checking-auth .box { visibility: hidden; }
  </style>
</head><body class="checking-auth">
  <div class="box">
    <h1>Sauna Login</h1>
    <label for="u">Username</label>
    <input id="u" type="text" autocomplete="username" autofocus>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
    <div id="err"></div>
  </div>
  <script>
    // If already authenticated, skip to dashboard. While the status check
    // is in flight, body.checking-auth keeps the form hidden (L5).
    (function() {
      function revealForm() { document.body.classList.remove('checking-auth'); }
      var tok = sessionStorage.getItem('sauna_token');
      if (!tok) { revealForm(); return; }
      fetch('/auth/status', { headers: { 'Authorization': 'Bearer ' + tok } })
        .then(function(r) {
          if (r.ok) window.location.href = '/';
          else      revealForm();
        })
        .catch(revealForm);
    })();

    function doLogin() {
      var u = document.getElementById('u').value.trim();
      var p = document.getElementById('p').value;
      var errEl = document.getElementById('err');
      errEl.innerText = '';
      if (!u || !p) { errEl.innerText = 'Enter username and password.'; return; }
      fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      }).then(function(r) {
        if (r.ok) return r.json().then(function(d) {
          sessionStorage.setItem('sauna_token', d.token);
          window.location.href = '/';
        });
        // M9 — surface 429 rate-limit lockout distinctly from 401 bad creds
        if (r.status === 429) {
          errEl.innerText = 'Too many attempts. Try again in a few minutes.';
        } else {
          errEl.innerText = 'Invalid username or password.';
        }
      }).catch(function() {
        errEl.innerText = 'Could not reach device.';
      });
    }

    document.getElementById('p').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body></html>
